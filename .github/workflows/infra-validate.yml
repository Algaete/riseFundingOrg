name: Infrastructure validation

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-*.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra-*.yml']

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without Azure credentials
        uses: azure/CLI@v2
        with:
          azcliversion: 2.76.0
          inlineScript: |
            az bicep install --version v0.46.1
            az bicep build --file infra/main.bicep --stdout > /dev/null
