name: Infrastructure validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment shell scripts
        run: |
          bash -n infra/scripts/deploy-dev.sh
          bash -n infra/scripts/prepare-key-vault-dev.sh
          bash -n infra/scripts/prepare-database-dev.sh
          bash -n infra/scripts/scale-api-dev.sh
          bash -n infra/scripts/set-api-access-dev.sh
          bash -n infra/scripts/rollback-api-dev.sh
          bash -n infra/scripts/verify-dev.sh
      - name: Compile Bicep without Azure credentials
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        with:
          azcliversion: 2.88.0
          inlineScript: |
            az bicep install --version v0.46.1
            az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Build the non-root API container without publishing it
        run: docker build --file src/FundingPlatform.Api/Dockerfile --tag rise-funding-api:ci .
