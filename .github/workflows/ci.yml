name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: funding-platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FundingPlatform.sln

      - name: Build
        run: dotnet build FundingPlatform.sln --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/FundingPlatform.UnitTests/FundingPlatform.UnitTests.csproj
          --configuration Release --no-build --no-restore

      - name: Integration tests
        run: >-
          dotnet test tests/FundingPlatform.IntegrationTests/FundingPlatform.IntegrationTests.csproj
          --configuration Release --no-build --no-restore

      - name: Publish and validate worker packages without Azure credentials
        run: >-
          python3 infra/scripts/package-workers.py build
          --output-directory artifacts/workers
          --source-revision "${{ github.sha }}"

      - name: Independently verify worker package manifests and checksums
        run: >-
          python3 infra/scripts/package-workers.py verify
          --artifact-directory artifacts/workers
          --source-revision "${{ github.sha }}"

      - name: Upload immutable worker packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-packages-${{ github.sha }}
          path: artifacts/workers
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  frontend:
    name: Frontend lint, unit tests, build and public E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/funding-platform-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/funding-platform-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Type-check browser tests
        run: npm run typecheck:e2e

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Public browser and accessibility tests
        run: npm run test:e2e:public

      - name: Upload the public Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-playwright-report-${{ github.sha }}
          path: frontend/funding-platform-web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
