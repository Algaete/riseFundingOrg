name: Azure dev infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: ARM operation; mutations require the matching confirmation below
        required: true
        type: choice
        options: [validate, what-if, apply-base, apply, scale-api, pause-api, resume-api, rollback-api]
        default: what-if
      confirmation:
        description: Select the phrase that matches the requested mutation
        required: true
        type: choice
        options:
          - NO-CONFIRMATION
          - DEPLOY-DEV-BASE
          - DEPLOY-DEV
          - SCALE-DEV-API
          - PAUSE-DEV-API
          - RESUME-DEV-API
          - ROLLBACK-DEV-API
        default: NO-CONFIRMATION
      api_min_replicas:
        description: Keep one API replica warm, or allow scale-to-zero
        required: true
        type: choice
        options: ['1', '0']
        default: '0'
      api_rollback_digest:
        description: Existing rise-funding-api sha256 digest; used only by rollback-api
        required: false
        type: string
      expected_release_sha:
        description: Approved 40-character main commit; required by apply
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: rise-funding-azure-dev-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: exit 1
      - name: Require the approved release commit for API apply
        if: inputs.operation == 'apply' && inputs.expected_release_sha != github.sha
        run: exit 1
      - name: Require explicit apply confirmation
        if: >-
          (inputs.operation == 'apply-base' && inputs.confirmation != 'DEPLOY-DEV-BASE') ||
          (inputs.operation == 'apply' && inputs.confirmation != 'DEPLOY-DEV') ||
          (inputs.operation == 'scale-api' && inputs.confirmation != 'SCALE-DEV-API') ||
          (inputs.operation == 'pause-api' && inputs.confirmation != 'PAUSE-DEV-API') ||
          (inputs.operation == 'resume-api' && inputs.confirmation != 'RESUME-DEV-API') ||
          (inputs.operation == 'rollback-api' && inputs.confirmation != 'ROLLBACK-DEV-API')
        run: exit 1
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run the manually selected infrastructure operation
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2.2.0
        env:
          RF_INFRA_OPERATION: ${{ inputs.operation }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
          AZURE_SQL_ADMIN_LOGIN: ${{ vars.AZURE_SQL_ADMIN_LOGIN }}
          AZURE_SQL_ADMIN_OBJECT_ID: ${{ vars.AZURE_SQL_ADMIN_OBJECT_ID }}
          AZURE_BUDGET_EMAIL: ${{ secrets.AZURE_BUDGET_EMAIL }}
          AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
          AZURE_MONTHLY_BUDGET_AMOUNT: ${{ vars.AZURE_MONTHLY_BUDGET_AMOUNT }}
          AZURE_DEPLOY_COMPUTE: ${{ vars.AZURE_DEPLOY_COMPUTE }}
          AZURE_API_MIN_REPLICAS: ${{ inputs.api_min_replicas }}
          AZURE_APPLY_CONFIRMATION: ${{ inputs.confirmation }}
          AZURE_API_SCALE_CONFIRMATION: ${{ inputs.confirmation }}
          AZURE_API_ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
          AZURE_API_ROLLBACK_DIGEST: ${{ inputs.api_rollback_digest }}
          AZURE_API_ACCESS_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          azcliversion: 2.88.0
          inlineScript: |
            if [[ "$RF_INFRA_OPERATION" == "scale-api" ]]; then
              bash infra/scripts/scale-api-dev.sh
            elif [[ "$RF_INFRA_OPERATION" == "pause-api" ]]; then
              bash infra/scripts/set-api-access-dev.sh pause
            elif [[ "$RF_INFRA_OPERATION" == "resume-api" ]]; then
              bash infra/scripts/set-api-access-dev.sh resume
            elif [[ "$RF_INFRA_OPERATION" == "rollback-api" ]]; then
              bash infra/scripts/rollback-api-dev.sh
            else
              az bicep install --version v0.46.1
              az bicep version
              bash infra/scripts/deploy-dev.sh "$RF_INFRA_OPERATION"
            fi
