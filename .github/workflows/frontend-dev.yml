name: Azure dev frontend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm publication of the dev technical preview
        required: true
        type: choice
        options:
          - NO-CONFIRMATION
          - DEPLOY-DEV-FRONTEND
        default: NO-CONFIRMATION
      expected_release_sha:
        description: Approved 40-character main commit to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rise-funding-azure-dev-frontend
  cancel-in-progress: false

jobs:
  resolve_targets:
    name: Resolve and validate Azure targets
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      api_base_url: ${{ steps.targets.outputs.api_base_url }}
      api_min_replicas: ${{ steps.targets.outputs.api_min_replicas }}
      frontend_origin: ${{ steps.targets.outputs.frontend_origin }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: exit 1

      - name: Require the approved release commit
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_RELEASE_SHA" = "$GITHUB_SHA"

      - name: Require explicit frontend confirmation
        if: inputs.confirmation != 'DEPLOY-DEV-FRONTEND'
        run: exit 1

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate the exact Static Web App and API
        id: targets
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
        with:
          azcliversion: 2.88.0
          inlineScript: |
            set -euo pipefail

            [[ "$AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$AZURE_TENANT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$AZURE_UNIQUE_SUFFIX" =~ ^[a-z0-9]{8}$ ]]

            actual_subscription="$(az account show --query id --output tsv --only-show-errors)"
            actual_tenant="$(az account show --query tenantId --output tsv --only-show-errors)"
            test "$actual_subscription" = "$AZURE_SUBSCRIPTION_ID"
            test "$actual_tenant" = "$AZURE_TENANT_ID"

            resource_group="rg-rf-dev-${AZURE_UNIQUE_SUFFIX}"
            swa_name="swa-rf-dev-${AZURE_UNIQUE_SUFFIX}"
            api_name="ca-rf-dev-${AZURE_UNIQUE_SUFFIX}-api"
            test "$(az group show --name "$resource_group" --query properties.provisioningState --output tsv --only-show-errors)" = "Succeeded"

            swa="$(az resource show --resource-group "$resource_group" --resource-type Microsoft.Web/staticSites --name "$swa_name" --api-version 2025-03-01 --output json --only-show-errors)"
            swa_hostname="$(jq -er '.properties.defaultHostname | select(type == "string" and length > 0)' <<<"$swa")"
            [[ "$swa_hostname" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)*\.azurestaticapps\.net$ ]]
            jq -e '
              .sku.name == "Free" and
              .properties.deploymentAuthPolicy == "DeploymentToken" and
              .properties.stagingEnvironmentPolicy == "Disabled" and
              .properties.allowConfigFileUpdates == true and
              .properties.publicNetworkAccess == "Enabled"
            ' <<<"$swa" >/dev/null

            api="$(az resource show --resource-group "$resource_group" --resource-type Microsoft.App/containerApps --name "$api_name" --api-version 2025-01-01 --output json --only-show-errors)"
            api_fqdn="$(jq -er '.properties.configuration.ingress.fqdn | select(type == "string" and length > 0)' <<<"$api")"
            [[ "$api_fqdn" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)*\.azurecontainerapps\.io$ ]]
            jq -e '
              .properties.provisioningState == "Succeeded" and
              .properties.configuration.ingress.external == true and
              .properties.latestRevisionName == .properties.latestReadyRevisionName and
              .properties.template.scale.maxReplicas == 1 and
              (.properties.template.scale.minReplicas == 0 or .properties.template.scale.minReplicas == 1)
            ' <<<"$api" >/dev/null

            frontend_origin="https://${swa_hostname}"
            api_base_url="https://${api_fqdn}/api/v1"
            configured_frontend="$(jq -er '[.properties.template.containers[0].env[] | select(.name == "FRONTEND_BASE_URL") | .value][0] // empty' <<<"$api")"
            configured_cors="$(jq -er '[.properties.template.containers[0].env[] | select(.name == "ALLOWED_CORS_ORIGINS") | .value][0] // empty' <<<"$api")"
            test "$configured_frontend" = "$frontend_origin"
            test "$configured_cors" = "$frontend_origin"

            api_min_replicas="$(jq -er '.properties.template.scale.minReplicas' <<<"$api")"
            printf 'frontend_origin=%s\n' "$frontend_origin" >> "$GITHUB_OUTPUT"
            printf 'api_base_url=%s\n' "$api_base_url" >> "$GITHUB_OUTPUT"
            printf 'api_min_replicas=%s\n' "$api_min_replicas" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test without Azure credentials
    needs: resolve_targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/funding-platform-web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/funding-platform-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build the production frontend
        env:
          VITE_API_BASE_URL: ${{ needs.resolve_targets.outputs.api_base_url }}
          VITE_EXTERNAL_AUTH_BASE_URL: ${{ needs.resolve_targets.outputs.api_base_url }}
        run: npm run build

      - name: Add immutable deployment metadata
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          printf '{"commitSha":"%s","runId":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/deploy-meta.json

      - name: Validate the prebuilt artifact
        env:
          VITE_API_BASE_URL: ${{ needs.resolve_targets.outputs.api_base_url }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          test -f dist/deploy-meta.json
          test "$(jq -r '.commitSha' dist/deploy-meta.json)" = "$GITHUB_SHA"
          jq -e '.navigationFallback.rewrite == "/index.html"' dist/staticwebapp.config.json >/dev/null
          grep -R -F "$VITE_API_BASE_URL" dist/assets --include='*.js' >/dev/null
          if grep -R -E 'localhost:[0-9]|127\.0\.0\.1' dist/assets --include='*.js' >/dev/null; then
            echo "The production bundle contains a local development endpoint" >&2
            exit 1
          fi
          if find dist -type f \( -name '*.map' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "The production artifact contains a source map or environment file" >&2
            exit 1
          fi

      - name: Upload the immutable frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/funding-platform-web/dist
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  deploy:
    name: Publish and verify the technical preview
    needs: [resolve_targets, build]
    environment:
      name: dev
      url: ${{ needs.resolve_targets.outputs.frontend_origin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the verified frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Revalidate the target and read the deployment token just in time
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
          EXPECTED_FRONTEND_ORIGIN: ${{ needs.resolve_targets.outputs.frontend_origin }}
          EXPECTED_API_BASE_URL: ${{ needs.resolve_targets.outputs.api_base_url }}
        with:
          azcliversion: 2.88.0
          inlineScript: |
            set -euo pipefail

            [[ "$AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$AZURE_TENANT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$AZURE_UNIQUE_SUFFIX" =~ ^[a-z0-9]{8}$ ]]
            [[ "$EXPECTED_FRONTEND_ORIGIN" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.azurestaticapps\.net$ ]]
            [[ "$EXPECTED_API_BASE_URL" =~ ^https://[a-z0-9-]+(\.[a-z0-9-]+)*\.azurecontainerapps\.io/api/v1$ ]]

            test "$(az account show --query id --output tsv --only-show-errors)" = "$AZURE_SUBSCRIPTION_ID"
            test "$(az account show --query tenantId --output tsv --only-show-errors)" = "$AZURE_TENANT_ID"

            resource_group="rg-rf-dev-${AZURE_UNIQUE_SUFFIX}"
            swa_name="swa-rf-dev-${AZURE_UNIQUE_SUFFIX}"
            api_name="ca-rf-dev-${AZURE_UNIQUE_SUFFIX}-api"
            swa_hostname="$(az resource show --resource-group "$resource_group" --resource-type Microsoft.Web/staticSites --name "$swa_name" --api-version 2025-03-01 --query properties.defaultHostname --output tsv --only-show-errors)"
            api_fqdn="$(az resource show --resource-group "$resource_group" --resource-type Microsoft.App/containerApps --name "$api_name" --api-version 2025-01-01 --query properties.configuration.ingress.fqdn --output tsv --only-show-errors)"
            test "https://${swa_hostname}" = "$EXPECTED_FRONTEND_ORIGIN"
            test "https://${api_fqdn}/api/v1" = "$EXPECTED_API_BASE_URL"

            deployment_token="$(az staticwebapp secrets list --resource-group "$resource_group" --name "$swa_name" --query properties.apiKey --output tsv --only-show-errors)"
            if [[ -z "$deployment_token" || "$deployment_token" == "null" || ${#deployment_token} -lt 32 ]]; then
              echo "Azure Static Web Apps did not return a valid deployment token" >&2
              exit 1
            fi
            echo "::add-mask::$deployment_token"
            printf 'SWA_DEPLOYMENT_TOKEN=%s\n' "$deployment_token" >> "$GITHUB_ENV"
            unset deployment_token

      - name: Deploy the prebuilt frontend
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, pinned
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend-dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Clear the deployment token from later steps
        if: always()
        run: printf 'SWA_DEPLOYMENT_TOKEN=\n' >> "$GITHUB_ENV"

      - name: Verify the published commit, SPA fallback and API CORS
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SQL_LOCATION: ${{ vars.AZURE_SQL_LOCATION }}
          AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
          AZURE_API_MIN_REPLICAS: ${{ needs.resolve_targets.outputs.api_min_replicas }}
          EXPECTED_FRONTEND_RELEASE_SHA: ${{ github.sha }}
        with:
          azcliversion: 2.88.0
          inlineScript: bash infra/scripts/verify-dev.sh frontend

      - name: Publish deployment summary
        env:
          FRONTEND_ORIGIN: ${{ needs.resolve_targets.outputs.frontend_origin }}
          API_BASE_URL: ${{ needs.resolve_targets.outputs.api_base_url }}
        run: |
          {
            echo '### Azure dev frontend published'
            echo
            echo "- Frontend: ${FRONTEND_ORIGIN}"
            echo "- API: ${API_BASE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo '- Scope: technical public preview; catalog, SPA fallback and API CORS verified.'
            echo '- Pending: same-site custom domains for persistent auth and Blob CORS/Functions for PDF import E2E.'
          } >> "$GITHUB_STEP_SUMMARY"
