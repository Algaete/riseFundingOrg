<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Plataforma de oportunidades de financiamiento para organizaciones sociales."
    />
    <title>FundingPlatform</title>
    <script>
      (() => {
        const preference = localStorage.getItem('funding-platform-theme') || 'system'
        const dark =
          preference === 'dark' ||
          (preference === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
